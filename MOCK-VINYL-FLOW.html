<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play a Vinyl — Infinite Crate</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background: #0A0A0A; }
.scene {
  width: 100%;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: #0A0A0A;
  cursor: grab;
  user-select: none;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
.scene:active { cursor: grabbing; }
.vinyl-slot {
  position: absolute;
  transform-origin: center bottom;
  will-change: transform, opacity;
  cursor: pointer;
}
.vinyl-slot .cover {
  width: 100%;
  height: 100%;
  border-radius: 3px;
  position: relative;
  overflow: hidden;
}
.vinyl-slot .cover-art {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: rgba(255,255,255,0.9);
  letter-spacing: -0.02em;
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
}
.vinyl-slot .vinyl-disc {
  position: absolute;
  top: 6%;
  right: -16%;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, #1e1e1e 0%, #0f0f0f 35%, #161616 55%, #0a0a0a 100%);
  opacity: 0;
  transition: opacity 0.35s ease, transform 0.35s ease;
  transform: translateX(-12px);
  pointer-events: none;
}
.vinyl-slot:hover .vinyl-disc {
  opacity: 1;
  transform: translateX(0);
}
.vinyl-disc .groove-rings {
  position: absolute;
  inset: 14%;
  border-radius: 50%;
  border: 0.5px solid rgba(255,255,255,0.03);
  box-shadow:
    inset 0 0 0 3px rgba(255,255,255,0.015),
    inset 0 0 0 7px rgba(255,255,255,0.02),
    inset 0 0 0 11px rgba(255,255,255,0.015),
    inset 0 0 0 15px rgba(255,255,255,0.02),
    inset 0 0 0 19px rgba(255,255,255,0.015);
}
.vinyl-disc .center-label {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 28%; height: 28%;
  border-radius: 50%;
  border: 0.5px solid rgba(255,255,255,0.07);
}
.vinyl-disc .spindle {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 5%; height: 5%;
  border-radius: 50%;
  background: #0A0A0A;
}
.info-panel {
  position: absolute;
  bottom: 20px;
  left: 32px;
  text-align: left;
  pointer-events: none;
  z-index: 100;
}
.info-panel .title {
  color: #FFFFFF;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.1;
  margin-bottom: 4px;
}
.info-panel .artist {
  color: #A89F95;
  font-size: 14px;
  font-weight: 400;
}
.fog-br {
  position: absolute;
  bottom: 0; right: 0;
  width: 55%; height: 45%;
  background: radial-gradient(ellipse at 100% 100%, rgba(10,10,10,0.95) 0%, transparent 70%);
  pointer-events: none; z-index: 70;
}
.fog-tl {
  position: absolute;
  top: 0; left: 0;
  width: 55%; height: 40%;
  background: radial-gradient(ellipse at 0% 0%, rgba(10,10,10,0.92) 0%, transparent 70%);
  pointer-events: none; z-index: 70;
}
.fog-edge-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 80px;
  background: linear-gradient(to top, #0A0A0A 0%, transparent 100%);
  pointer-events: none; z-index: 75;
}
.fog-edge-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 60px;
  background: linear-gradient(to bottom, #0A0A0A 0%, transparent 100%);
  pointer-events: none; z-index: 75;
}
.ambient-glow {
  position: absolute;
  width: 300px; height: 220px;
  border-radius: 50%;
  pointer-events: none; z-index: 1;
  transition: background 0.8s;
}
.scroll-hint {
  position: absolute;
  bottom: 24px; right: 28px;
  display: flex; align-items: center; gap: 8px;
  pointer-events: none; z-index: 90;
  opacity: 0.5;
  animation: hintFade 2.5s ease-in-out infinite;
}
@keyframes hintFade { 0%,100%{opacity:0.5;} 50%{opacity:0.2;} }
.scroll-hint .label { color: #6B635B; font-size: 11px; font-weight: 500; letter-spacing: 0.05em; }
.counter {
  position: absolute; top: 16px; right: 20px;
  color: #3D3832; font-size: 11px; font-weight: 500;
  letter-spacing: 0.04em; z-index: 90;
}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="fog-tl"></div>
  <div class="fog-br"></div>
  <div class="fog-edge-bottom"></div>
  <div class="fog-edge-top"></div>
  <div class="ambient-glow" id="ambientGlow"></div>

  <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;" viewBox="0 0 680 560" preserveAspectRatio="none">
    <line x1="260" y1="440" x2="420" y2="175" stroke="rgba(140,105,60,0.05)" stroke-width="0.5"/>
    <line x1="285" y1="440" x2="395" y2="175" stroke="rgba(140,105,60,0.04)" stroke-width="0.5"/>
    <line x1="265" y1="438" x2="418" y2="178" stroke="rgba(110,80,45,0.06)" stroke-width="1.2"/>
    <line x1="315" y1="438" x2="455" y2="178" stroke="rgba(110,80,45,0.06)" stroke-width="1.2"/>
    <rect x="261" y="430" width="7" height="12" rx="1" fill="rgba(110,80,45,0.09)" stroke="rgba(140,110,70,0.06)" stroke-width="0.5"/>
  </svg>

  <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;" viewBox="0 0 680 560" preserveAspectRatio="none">
    <rect x="257" y="182" width="5" height="258" rx="1.5" fill="rgba(100,75,45,0.08)" stroke="rgba(130,100,60,0.06)" stroke-width="0.5"/>
    <line x1="259" y1="184" x2="259" y2="438" stroke="rgba(170,140,90,0.03)" stroke-width="0.5"/>
  </svg>

  <div style="position:absolute;inset:0;z-index:10;" id="slots"></div>

  <div class="info-panel" id="infoPanel">
    <div class="title" id="infoTitle"></div>
    <div class="artist" id="infoArtist"></div>
  </div>

  <div class="scroll-hint" id="scrollHint">
    <span class="label">scroll</span>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M4 6L8 2L12 6" stroke="#6B635B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 10L8 14L12 10" stroke="#6B635B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="counter" id="counter"></div>
</div>

<script>
var ALBUMS = [
  { title: "Midnight Reverb", artist: "The Analog Drifters", hue: 25, bg: "linear-gradient(135deg, #8B4513 0%, #D2691E 50%, #CD853F 100%)" },
  { title: "Neon Dust", artist: "Glass Horizon", hue: 280, bg: "linear-gradient(135deg, #4B0082 0%, #8A2BE2 50%, #9370DB 100%)" },
  { title: "Velvet Frequencies", artist: "Ohm Collective", hue: 340, bg: "linear-gradient(135deg, #8B0000 0%, #DC143C 50%, #FF6B6B 100%)" },
  { title: "Pacific Dreams", artist: "Coastal", hue: 195, bg: "linear-gradient(135deg, #006994 0%, #00A4CC 50%, #5BC0DE 100%)" },
  { title: "Amber Sessions", artist: "Warm Static", hue: 35, bg: "linear-gradient(135deg, #B36D14 0%, #D4851F 50%, #E8A84C 100%)" },
  { title: "Ghost Transmissions", artist: "Echo Bureau", hue: 160, bg: "linear-gradient(135deg, #2E4E3F 0%, #3CB371 50%, #66CDAA 100%)" },
  { title: "After Hours", artist: "Dimlight", hue: 250, bg: "linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)" },
  { title: "Sahara Gold", artist: "Desert Pulse", hue: 42, bg: "linear-gradient(135deg, #8B6914 0%, #DAA520 50%, #FFD700 100%)" },
  { title: "Blue Carbon", artist: "Void Engine", hue: 210, bg: "linear-gradient(135deg, #1B2838 0%, #2C5F7C 50%, #4682B4 100%)" },
  { title: "Rose Voltage", artist: "LVNA", hue: 330, bg: "linear-gradient(135deg, #85144B 0%, #C2185B 50%, #E91E63 100%)" },
  { title: "Concrete Bloom", artist: "Brutalist", hue: 0, bg: "linear-gradient(135deg, #3D3832 0%, #6B635B 50%, #A89F95 100%)" },
  { title: "Solar Wind", artist: "Flare", hue: 50, bg: "linear-gradient(135deg, #CC7A00 0%, #FF9800 50%, #FFB74D 100%)" },
  { title: "Deep Indigo", artist: "Submersion", hue: 240, bg: "linear-gradient(135deg, #1A1A3E 0%, #303F9F 50%, #5C6BC0 100%)" },
  { title: "Rust & Rain", artist: "Oxidane", hue: 15, bg: "linear-gradient(135deg, #5D3A1A 0%, #A0522D 50%, #CD853F 100%)" },
  { title: "White Noise Garden", artist: "Moss", hue: 120, bg: "linear-gradient(135deg, #2D5016 0%, #4CAF50 50%, #81C784 100%)" },
  { title: "Lunar Phase", artist: "Artemis", hue: 220, bg: "linear-gradient(135deg, #0D1B2A 0%, #1B3A5C 50%, #415A77 100%)" },
  { title: "Crimson Tape", artist: "Retroglass", hue: 0, bg: "linear-gradient(135deg, #5C1010 0%, #B71C1C 50%, #EF5350 100%)" },
  { title: "Warm Circuits", artist: "Analogue Heart", hue: 30, bg: "linear-gradient(135deg, #4E342E 0%, #795548 50%, #A1887F 100%)" },
  { title: "Phantom Groove", artist: "Spectral", hue: 270, bg: "linear-gradient(135deg, #311B92 0%, #651FFF 50%, #B388FF 100%)" },
  { title: "Terra Firma", artist: "Groundswell", hue: 80, bg: "linear-gradient(135deg, #33691E 0%, #689F38 50%, #9CCC65 100%)" },
];

var scene = document.getElementById('scene');
var slotsContainer = document.getElementById('slots');
var infoTitle = document.getElementById('infoTitle');
var infoArtist = document.getElementById('infoArtist');
var ambientGlow = document.getElementById('ambientGlow');
var scrollHint = document.getElementById('scrollHint');
var counter = document.getElementById('counter');

var scrollPos = 0;
var TOTAL = ALBUMS.length;
var VISIBLE = 22;
var hintHidden = false;

var startX = 0.40;
var startY = 0.74;
var endX = 0.60;
var endY = 0.32;

function lerp(a, b, t) { return a + (b - a) * t; }
function easeOut(t) { return 1 - Math.pow(1 - t, 3.5); }

function render() {
  var W = scene.offsetWidth;
  var H = scene.offsetHeight;

  var ox = W * startX;
  var oy = H * startY;
  var fx = W * endX;
  var fy = H * endY;

  var frontIdx = Math.round(scrollPos);
  var clampedFront = Math.max(0, Math.min(TOTAL - 1, frontIdx));

  infoTitle.textContent = ALBUMS[clampedFront].title;
  infoArtist.textContent = ALBUMS[clampedFront].artist;
  counter.textContent = (clampedFront + 1) + " / " + TOTAL;

  var hue = ALBUMS[clampedFront].hue;
  var glowX = lerp(ox, fx, 0.1);
  var glowY = lerp(oy, fy, 0.1);
  ambientGlow.style.left = glowX + 'px';
  ambientGlow.style.top = glowY + 'px';
  ambientGlow.style.transform = 'translate(-50%,-50%)';
  ambientGlow.style.background = 'radial-gradient(ellipse, hsla(' + hue + ',40%,22%,0.16) 0%, transparent 70%)';

  var html = '';
  var baseSize = Math.min(155, W * 0.23);

  for (var i = -1; i < VISIBLE; i++) {
    var depth = i - (scrollPos - Math.floor(scrollPos));
    var albumIdx = Math.floor(scrollPos) + i;
    if (albumIdx < 0 || albumIdx >= TOTAL) continue;

    var t = Math.max(0, Math.min(1, depth / (VISIBLE - 1)));
    var e = easeOut(t);

    var cx = lerp(ox, fx, e);
    var cy = lerp(oy, fy, e);

    var scale = 1.0 - e * 0.88;
    var w = baseSize * scale;
    var h = w;

    var x = cx - w * 0.5;
    var y = cy - h;

    var opacity = depth < 0
      ? Math.max(0, 1 + depth)
      : (t < 0.65 ? 1.0 : 1.0 - (t - 0.65) / 0.35);

    var tiltX = e * 65;
    var tiltY = e * -5;
    var zIdx = 300 - i;

    var album = ALBUMS[albumIdx];
    var shadowA = Math.max(0.04, 0.4 * (1 - e));
    var shadowB = Math.round(5 + 16 * (1 - e));

    html += '<div class="vinyl-slot" style="'
      + 'left:' + x.toFixed(1) + 'px;'
      + 'top:' + y.toFixed(1) + 'px;'
      + 'width:' + w.toFixed(1) + 'px;'
      + 'height:' + h.toFixed(1) + 'px;'
      + 'opacity:' + opacity.toFixed(3) + ';'
      + 'z-index:' + zIdx + ';'
      + 'transform:perspective(900px) rotateX(' + tiltX.toFixed(1) + 'deg) rotateY(' + tiltY.toFixed(1) + 'deg);'
      + '">'
      + '<div class="cover" style="box-shadow:0 ' + Math.round(3*(1-e)) + 'px ' + shadowB + 'px rgba(0,0,0,' + shadowA.toFixed(2) + '), inset 0 1px 0 rgba(255,255,255,0.06);">'
      + '<div class="cover-art" style="background:' + album.bg + ';font-size:' + Math.max(9, Math.round(14 * scale)) + 'px;">'
      + '<span style="padding:6px;text-align:center;line-height:1.2;">'
      + (scale > 0.42 ? album.title : '')
      + '</span>'
      + '</div>'
      + '<div class="vinyl-disc" style="width:' + (h * 0.8).toFixed(0) + 'px;height:' + (h * 0.8).toFixed(0) + 'px;">'
      + '<div class="groove-rings"></div>'
      + '<div class="center-label" style="background:' + album.bg + ';"></div>'
      + '<div class="spindle"></div>'
      + '</div>'
      + '</div>'
      + '</div>';
  }

  slotsContainer.innerHTML = html;
}

scene.addEventListener('wheel', function(e) {
  e.preventDefault();
  var delta = e.deltaY * 0.004;
  scrollPos = Math.max(-0.3, Math.min(TOTAL - 0.7, scrollPos + delta));
  if (!hintHidden) { scrollHint.style.opacity = '0'; hintHidden = true; }
  render();
}, { passive: false });

var touchSY = 0, touchSX = 0;
scene.addEventListener('touchstart', function(e) {
  touchSY = e.touches[0].clientY;
  touchSX = e.touches[0].clientX;
});
scene.addEventListener('touchmove', function(e) {
  e.preventDefault();
  var dy = touchSY - e.touches[0].clientY;
  var dx = e.touches[0].clientX - touchSX;
  touchSY = e.touches[0].clientY;
  touchSX = e.touches[0].clientX;
  scrollPos = Math.max(-0.3, Math.min(TOTAL - 0.7, scrollPos + (dy + dx) * 0.006));
  if (!hintHidden) { scrollHint.style.opacity = '0'; hintHidden = true; }
  render();
}, { passive: false });

render();
window.addEventListener('resize', render);
</script>
</body>
</html>
